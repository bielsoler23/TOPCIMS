<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOPCIMS - Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Inter:wght@500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter'; }
    .titol { font-family: 'Oswald'; }
  </style>
</head>

<body class="min-h-screen flex flex-col bg-cover bg-center text-[#F1EBDF]" style="background-image: url('img/login.jpg');">

  <header class="flex items-center gap-2 p-6">
    <img src="img/logo.svg" alt="logo" class="w-10">
    <a href="index.html" class="titol text-3xl">TOPCIMS</a>
  </header>

  <main class="flex-1 p-6">
    <div class="w-[550px] bg-black/60 rounded-lg p-10">
      <h1 class="titol text-5xl text-center">TORNA A TOPCIMS</h1>
      <p class="text-sm text-center">Introdueix les teves dades per accedir a la teva aventura</p>

      <form>
        <p class="titol text-lg mt-8">CORREU ELECTRÒNIC</p>
        <input type="email" class="w-full bg-[#F1EBDF] text-black rounded-lg p-3">

        <p class="titol text-lg mt-4">CONTRASENYA</p>
        <input type="password" class="w-full bg-[#F1EBDF] text-black rounded-lg p-3">
        <p class="text-sm text-right underline">Has oblidat la contrasenya?</p>

        <button class="titol w-full bg-[#B93812] text-xl rounded-full py-2 mt-8">INICIAR SESSIÓ</button>
      </form>

      <p class="text-sm text-center mt-4">Encara no tens un compte? Registra't <a href="registre.html" class="underline">aquí</a></p>
    </div>
  </main>

  <footer class="flex justify-between bg-[#0B1A1C] px-6 py-3">
    <p class="titol">© 2026 TOPCIMS</p>
    <div class="flex gap-4">
      <img src="img/instagram.svg" alt="instagram" class="w-5">
      <img src="img/twitter.svg" alt="twitter" class="w-5">
      <img src="img/facebook.svg" alt="facebook" class="w-5">
    </div>
  </footer>

</body>
</html>
